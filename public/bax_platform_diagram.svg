<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 442" width="750" height="442" font-family="Open Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7cc0"/>
      <stop offset="1" stop-color="#1a5d96"/>
    </linearGradient>
    <!-- Arrow pointing right; origin = tail, vertical centre -->
    <path id="arrow" d="M0,-5 H30 V-12 L48,0 L30,12 V5 H0 Z"
          fill="url(#arrowFill)" stroke="#1a5d96" stroke-width="1"
          stroke-linejoin="round"/>
  </defs>

  <!-- Background -->
  <rect width="750" height="442" fill="#e9f3fb"/>

  <!-- Panels -->
  <g fill="#e9f3fb" stroke="#2f80c3" stroke-width="2">
    <rect x="40" y="38" width="182" height="380"/>
    <rect x="233" y="38" width="285" height="380"/>
    <rect x="530" y="38" width="182" height="380"/>
  </g>

  <!-- Core system boxes -->
  <g fill="#d3e6f6" stroke="#2f80c3" stroke-width="2">
    <rect x="70" y="70" width="122" height="72"/>
    <rect x="70" y="162" width="122" height="72"/>
    <rect x="70" y="250" width="122" height="72"/>
  </g>
  <g fill="#1d5f99" font-size="22" font-weight="700" text-anchor="middle">
    <text x="131" y="114">LoanIQ</text>
    <text x="131" y="206">Murex</text>
    <text x="131" y="294">T24, …</text>
  </g>

  <!-- BAX inner box -->
  <rect x="250" y="58" width="250" height="265" fill="#d3e6f6" stroke="#2f80c3" stroke-width="2"/>
  <g fill="#1d5f99" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="372" y="103">Integrate</text>
    <text x="372" y="142">Validate</text>
    <text x="372" y="181">Process</text>
    <text x="372" y="220">Report</text>
  </g>

  <!-- BIRD database cylinder -->
  <path d="M313,272 V336 A62,13 0 0 0 437,336 V272" fill="#e9f3fb" stroke="#2f80c3" stroke-width="2"/>
  <ellipse cx="375" cy="272" rx="62" ry="13" fill="#e9f3fb" stroke="#2f80c3" stroke-width="2"/>
  <text x="375" y="325" fill="#1d5f99" font-size="22" font-weight="700" text-anchor="middle">BIRD</text>

  <!-- Regulator boxes -->
  <g fill="#d3e6f6" stroke="#2f80c3" stroke-width="2">
    <rect x="558" y="72" width="122" height="70"/>
    <rect x="558" y="162" width="122" height="70"/>
    <rect x="558" y="250" width="122" height="72"/>
  </g>
  <g fill="#1d5f99" font-size="22" font-weight="700" text-anchor="middle">
    <text x="619" y="115">FinRep</text>
    <text x="619" y="205">IReF</text>
    <text x="619" y="280.5">Ana</text>
    <text x="619" y="307.5">Credit</text>
  </g>

  <!-- Arrows into platform (aligned to core system box centres) -->
  <use href="#arrow" x="198" y="106"/>
  <use href="#arrow" x="198" y="198"/>
  <use href="#arrow" x="198" y="286"/>

  <!-- Arrows out to regulators (aligned to regulator box centres) -->
  <use href="#arrow" x="505" y="107"/>
  <use href="#arrow" x="505" y="197"/>
  <use href="#arrow" x="505" y="286"/>

  <!-- Panel labels -->
  <g fill="#1d5f99" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="131" y="360">Core</text>
    <text x="131" y="388">Systems</text>
    <text x="375" y="388">BAX Platform</text>
    <text x="621" y="388">Regulators</text>
  </g>
</svg>
